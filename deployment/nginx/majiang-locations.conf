# 广东麻将训练（gd-mahjong-trainer）· 挂载于 www.jp703.xin /majiang/ 子路径
# 本文件由 `bash deployment/release.sh init` 下发到 ECS 的
# /etc/nginx/snippets/majiang-locations.conf，并由 cp-space.conf 的
# 443 server 块（jp703.xin）内一行 `include` 引用——改动后重跑 init 即生效。
# 勿手改服务器上的副本，仓库内这份是唯一源。

# URI → 文件映射：/majiang/<x> → /opt/gd-mahjong/majiang/<x>
# 其中 /opt/gd-mahjong/majiang 是指向 releases/<时间戳>（经 current）的固定 symlink，
# 由 release.sh deploy 原子切换 current，本配置无需随发布变更。

location = /majiang { return 301 /majiang/; }

location ^~ /majiang/ {
    root /opt/gd-mahjong;
    index index.html;
    # PWA 入口与 Service Worker：每次向源站校验新版本——SW autoUpdate 靠它感知发版
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_vary on;
    # SPA 路由回退：BrowserRouter 深链（/majiang/play、/majiang/calculator…）
    try_files $uri $uri/ /majiang/index.html;
}

# 带内容 hash 的构建产物：永久缓存（内容一变文件名即变）
location ^~ /majiang/assets/ {
    root /opt/gd-mahjong;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    try_files $uri =404;
}
